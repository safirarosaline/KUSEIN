<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kuis Sejarah Indonesia</title>

  <style>
    :root {
      --ungu: #6c4ee6;
      --ungu-gelap: #4831a8;
      --kuning: #ffd166;
      --oranye: #ff9f43;
      --hijau: #38c172;
      --merah: #ef476f;
      --biru-muda: #dff6ff;
      --putih: #ffffff;
      --gelap: #292447;
      --abu: #666;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, Helvetica, sans-serif;
    }

    body {
      min-height: 100vh;
      color: var(--gelap);
      background:
        radial-gradient(circle at top left, #ffe29a 0, transparent 28%),
        radial-gradient(circle at bottom right, #bde0fe 0, transparent 30%),
        linear-gradient(135deg, #fff5d6, #e7dcff);
      padding: 20px;
    }

    .container {
      width: min(100%, 950px);
      margin: auto;
    }

    header {
      text-align: center;
      padding: 30px 20px;
      margin-bottom: 20px;
      color: white;
      border-radius: 25px;
      background: linear-gradient(135deg, var(--ungu), var(--oranye));
      box-shadow: 0 12px 30px rgba(78, 54, 180, 0.25);
    }

    header h1 {
      font-size: clamp(2rem, 5vw, 3.5rem);
      margin-bottom: 10px;
    }

    header p {
      font-size: 1.05rem;
    }

    .card {
      background: rgba(255, 255, 255, 0.95);
      border-radius: 22px;
      padding: 25px;
      margin-bottom: 20px;
      box-shadow: 0 10px 25px rgba(60, 44, 120, 0.12);
    }

    .hidden {
      display: none !important;
    }
